services:
  - type: web
    name: judgex-myakalavignesh01
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn judgex.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: judgex-db
          property: connectionString
      - key: UPLOAD_ROOT
        value: /tmp/judgex-private-uploads
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: judgex-myakalavignesh01
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGINS
        fromService:
          type: web
          name: judgex-myakalavignesh01
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOW_ORGANIZER_SIGNUP
        value: "false"
      - key: BOOTSTRAP_ORGANIZER_NAME
        sync: false
      - key: BOOTSTRAP_ORGANIZER_EMAIL
        sync: false
      - key: BOOTSTRAP_ORGANIZER_INSTITUTION
        sync: false
      - key: BOOTSTRAP_ORGANIZER_PASSWORD
        sync: false

databases:
  - name: judgex-db
    plan: free
    region: singapore
    databaseName: judgex
    user: judgex
